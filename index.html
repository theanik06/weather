<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a, #020617);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .weather-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    button {
      padding: 12px 18px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .city-name {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .weather-desc {
      font-size: 14px;
      color: #94a3b8;
      text-transform: capitalize;
      margin-bottom: 15px;
    }

    .temp-display {
      font-size: 54px;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 25px;
    }

    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .detail-item {
      background: rgba(15, 23, 42, 0.6);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-item span {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .detail-item strong {
      font-size: 16px;
      color: #38bdf8;
    }

    .status-msg {
      font-size: 14px;
      color: #f43f5e;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="weather-card">
    <h1>WEATHER RADAR</h1>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name..." value="Kolkata">
      <button onclick="fetchWeather()">Search</button>
    </div>

    <div id="weather-info">
      <div class="city-name" id="city-text">--</div>
      <div class="weather-desc" id="condition-text">Fetching data...</div>
      <div class="temp-display" id="temp-text">--°C</div>

      <div class="weather-details">
        <div class="detail-item">
          <span>Wind Speed</span>
          <strong id="wind-text">-- km/h</strong>
        </div>
        <div class="detail-item">
          <span>Wind Direction</span>
          <strong id="dir-text">--°</strong>
        </div>
      </div>
    </div>

    <div class="status-msg" id="status-msg"></div>
  </div>

  <script>
    async function fetchWeather() {
      const city = document.getElementById('city-input').value.trim();
      const statusMsg = document.getElementById('status-msg');

      if (!city) return;

      statusMsg.style.display = 'none';

      try {
        // Step 1: Geocoding API to get Lat & Lon
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          showError("City not found!");
          return;
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        // Step 2: Open-Meteo Weather API
        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
        const weatherData = await weatherRes.json();

        const current = weatherData.current_weather;

        document.getElementById('city-text').textContent = `${name}, ${country}`;
        document.getElementById('temp-text').textContent = `${Math.round(current.temperature)}°C`;
        document.getElementById('wind-text').textContent = `${current.windspeed} km/h`;
        document.getElementById('dir-text').textContent = `${current.winddirection}°`;
        document.getElementById('condition-text').textContent = getWeatherStatus(current.weathercode);

      } catch (err) {
        showError("Failed to fetch weather data.");
      }
    }

    function getWeatherStatus(code) {
      if (code === 0) return "Clear Sky";
      if (code >= 1 && code <= 3) return "Partly Cloudy";
      if (code >= 45 && code <= 48) return "Foggy";
      if (code >= 51 && code <= 67) return "Rainy";
      if (code >= 71 && code <= 77) return "Snow";
      if (code >= 80 && code <= 82) return "Heavy Showers";
      if (code >= 95) return "Thunderstorm";
      return "Cloudy";
    }

    function showError(msg) {
      const statusMsg = document.getElementById('status-msg');
      statusMsg.textContent = msg;
      statusMsg.style.display = 'block';
    }

    // Load default on start
    fetchWeather();
  </script>
</body>
</html>
